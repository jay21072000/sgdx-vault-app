[package]
name = "sgdx-vault"
version = "0.1.0"
description = "SGDX Vault — Token-2022 stablecoin mint/redeem against USDT collateral"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sgdx_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "token_2022", "associated_token"] }
solana-program = "=1.18.26"


